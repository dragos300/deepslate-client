name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux:appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json
      - run: npm install
      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Copy into setups/
        run: npm run copy-setups
      - uses: actions/upload-artifact@v4
        with:
          name: setups-${{ matrix.os }}
          path: |
            setups/*.exe
            setups/*.dmg
            setups/*.AppImage
            setups/*.deb
            setups/*.zip
            setups/*.tar.gz
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            setups/*.exe
            setups/*.dmg
            setups/*.AppImage
            setups/*.deb
            setups/*.zip
            setups/*.tar.gz
          fail_on_unmatched_files: false
